services:
  web:
    build: .
    container_name: php_apache
    ports:
      - "8080:80"
    volumes: 
      - ./app:/var/www/html/
    depends_on:
      - db
  
  db:
    image: postgres:17
    container_name: postgres_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: egorbezrukavnikov@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin228
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data: